baseURL = "https://uswrma.com/"
languageCode = "en-us"
title = "Washington Rachmaninoff Musicians Association"
theme = "PaperMod"

# Output formats
outputs = { home = ["HTML", "JSON"] }

# Pagination
[pagination]
  pagerSize = 10

# Markup settings
[markup]
  [markup.goldmark.renderer]
    unsafe = true

# Menu items
[[menu.main]]
  name = "Home"
  url = "/"
  weight = 10

[[menu.main]]
  name = "About"
  url = "/about-us/"
  weight = 20

[[menu.main]]
  name = "WIRMC"
  url = "/wirmc/"
  weight = 30

[[menu.main]]
  name = "Highlights"
  url = "/highlights/"
  weight = 40

[[menu.main]]
  name = "Gallery"
  url = "/gallery/"
  weight = 50

[[menu.main]]
  name = "News"
  url = "/news/"
  weight = 60

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 70

# Site parameters
[params]
  env = "production"
  title = "Washington Rachmaninoff Musicians Association"
  description = "Washington Rachmaninoff Musicians Association — a nonprofit organization promoting classical music education worldwide"
  keywords = ["musicians", "association", "washington", "rachmaninoff", "classical music", "nonprofit", "WIRMC"]
  author = "Washington Rachmaninoff Musicians Association"
  mainSections = ["news"]

  # Theme settings
  defaultTheme = "light"
  disableThemeToggle = true
  ShowBreadCrumbs = false
  ShowPostNavLinks = false
  ShowCodeCopyButtons = false
  ShowToc = false
  TocOpen = false
  ShowShareButtons = false
  ShowReadingTime = false

  # Social media (optional)
  [params.social]
    email = "wirmc@hotmail.com"
    github = ""
    linkedin = ""
    twitter = ""
